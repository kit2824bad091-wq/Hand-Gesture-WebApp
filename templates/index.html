<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Hand Gesture Recognition
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>
        Hand Gesture Recognition
    </h1>

    <h2 class="subtitle">
        AI Based Hand Gesture Detection System
    </h2>

    <p class="description">
        This web application detects and recognizes
        hand gestures using Python, OpenCV,
        MediaPipe and Flask.
    </p>


    <div class="camera-box">

        <video
            id="video"
            autoplay
            playsinline
            muted
        >
        </video>

        <canvas
            id="canvas"
            style="display:none;"
        >
        </canvas>


        <div class="result-box">

            <h2 id="gesture-result">
                Gesture: Loading Model...
            </h2>

            <p id="finger-result">
                Fingers: 0
            </p>

        </div>

    </div>


    <h3>
        Supported Gestures
    </h3>


    <div class="gestures">

        <p>🖐️ Open Palm</p>

        <p>✊ Fist</p>

        <p>✌️ Victory</p>

        <p>☝️ Pointing</p>

        <p>👍 Thumbs Up</p>

    </div>

</div>


<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";


const video =
    document.getElementById("video");

const gestureResult =
    document.getElementById("gesture-result");

const fingerResult =
    document.getElementById("finger-result");


let handLandmarker = null;

let lastVideoTime = -1;

let lastProcessTime = 0;


// ==========================================
// DISTANCE
// ==========================================

function distance(a, b) {

    const x =
        a.x - b.x;

    const y =
        a.y - b.y;

    return Math.sqrt(
        x * x +
        y * y
    );

}


// ==========================================
// ANGLE
// ==========================================

function calculateAngle(a, b, c) {

    const abX =
        a.x - b.x;

    const abY =
        a.y - b.y;

    const cbX =
        c.x - b.x;

    const cbY =
        c.y - b.y;


    const dot =
        abX * cbX +
        abY * cbY;


    const magAB =
        Math.sqrt(
            abX * abX +
            abY * abY
        );


    const magCB =
        Math.sqrt(
            cbX * cbX +
            cbY * cbY
        );


    if (
        magAB === 0 ||
        magCB === 0
    ) {

        return 0;

    }


    let value =
        dot /
        (magAB * magCB);


    value =
        Math.max(
            -1,
            Math.min(
                1,
                value
            )
        );


    return (
        Math.acos(value)
        *
        180
        /
        Math.PI
    );

}


// ==========================================
// GESTURE RECOGNITION
// ==========================================

function recognizeGesture(points) {

    const indexAngle =
        calculateAngle(
            points[5],
            points[6],
            points[8]
        );


    const middleAngle =
        calculateAngle(
            points[9],
            points[10],
            points[12]
        );


    const ringAngle =
        calculateAngle(
            points[13],
            points[14],
            points[16]
        );


    const pinkyAngle =
        calculateAngle(
            points[17],
            points[18],
            points[20]
        );


    const thumbAngle =
        calculateAngle(
            points[2],
            points[3],
            points[4]
        );


    const indexExtended =
        indexAngle > 150;


    const middleExtended =
        middleAngle > 150;


    const ringExtended =
        ringAngle > 150;


    const pinkyExtended =
        pinkyAngle > 150;


    const wrist =
        points[0];


    const thumbTip =
        points[4];


    const thumbIP =
        points[3];


    const thumbMCP =
        points[2];


    const thumbTipDistance =
        distance(
            wrist,
            thumbTip
        );


    const thumbIPDistance =
        distance(
            wrist,
            thumbIP
        );


    const thumbExtended =
        (
            thumbAngle > 145
            &&
            thumbTipDistance >
            thumbIPDistance * 1.08
        );


    const thumbUp =
        (
            thumbExtended
            &&
            thumbTip.y <
            thumbMCP.y
        );


    const fingerCount =
        Number(thumbExtended)
        +
        Number(indexExtended)
        +
        Number(middleExtended)
        +
        Number(ringExtended)
        +
        Number(pinkyExtended);


    let gesture =
        "Unknown";


    // ======================================
    // THUMBS UP
    // ======================================

    if (

        thumbUp

        && !indexExtended

        && !middleExtended

        && !ringExtended

        && !pinkyExtended

    ) {

        gesture =
            "Thumbs Up";

    }


    // ======================================
    // VICTORY
    // ======================================

    else if (

        indexExtended

        && middleExtended

        && !ringExtended

        && !pinkyExtended

    ) {

        gesture =
            "Victory";

    }


    // ======================================
    // POINTING
    // ======================================

    else if (

        indexExtended

        && !middleExtended

        && !ringExtended

        && !pinkyExtended

    ) {

        gesture =
            "Pointing";

    }


    // ======================================
    // OPEN PALM
    // ======================================

    else if (

        indexExtended

        && middleExtended

        && ringExtended

        && pinkyExtended

    ) {

        gesture =
            "Open Palm";

    }


    // ======================================
    // FIST
    // ======================================

    else if (

        !thumbExtended

        && !indexExtended

        && !middleExtended

        && !ringExtended

        && !pinkyExtended

    ) {

        gesture =
            "Fist";

    }


    return {

        gesture:
            gesture,

        fingers:
            fingerCount

    };

}


// ==========================================
// LOAD MEDIAPIPE MODEL
// ==========================================

async function loadMediaPipe() {

    try {

        gestureResult.innerText =
            "Gesture: Loading Model...";


        const vision =
            await FilesetResolver
            .forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"

            );


        handLandmarker =
            await HandLandmarker
            .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

                    },


                    runningMode:
                        "VIDEO",


                    numHands:
                        1,


                    minHandDetectionConfidence:
                        0.3,


                    minHandPresenceConfidence:
                        0.3,


                    minTrackingConfidence:
                        0.3

                }

            );


        gestureResult.innerText =
            "Gesture: Starting Camera...";


        await startCamera();

    }

    catch (error) {

        console.error(
            "MediaPipe Error:",
            error
        );


        gestureResult.innerText =
            "Gesture: Model Error";

    }

}


// ==========================================
// START CAMERA
// ==========================================

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "user",

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }

                },

                audio:
                    false

            });


        video.srcObject =
            stream;


        await video.play();


        gestureResult.innerText =
            "Gesture: No Hand";


        fingerResult.innerText =
            "Fingers: 0";


        requestAnimationFrame(
            detectHands
        );

    }

    catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        gestureResult.innerText =
            "Camera permission denied";

    }

}


// ==========================================
// LIVE HAND DETECTION
// ==========================================

function detectHands() {

    if (!handLandmarker) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    if (
        video.readyState < 2
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    const now =
        performance.now();


    // Process about 8 frames per second.
    // Helps phones and low-power devices.

    if (
        now - lastProcessTime <
        120
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    lastProcessTime =
        now;


    if (
        video.currentTime ===
        lastVideoTime
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    lastVideoTime =
        video.currentTime;


    try {

        const results =
            handLandmarker
            .detectForVideo(
                video,
                now
            );


        if (
            results.landmarks
            &&
            results.landmarks.length > 0
        ) {

            const points =
                results.landmarks[0];


            const result =
                recognizeGesture(
                    points
                );


            gestureResult.innerText =
                "Gesture: "
                +
                result.gesture;


            fingerResult.innerText =
                "Fingers: "
                +
                result.fingers;

        }

        else {

            gestureResult.innerText =
                "Gesture: No Hand";


            fingerResult.innerText =
                "Fingers: 0";

        }

    }

    catch (error) {

        console.error(
            "Detection Error:",
            error
        );

    }


    requestAnimationFrame(
        detectHands
    );

}


// ==========================================
// START APPLICATION
// ==========================================

loadMediaPipe();

</script>


</body>

</html>
